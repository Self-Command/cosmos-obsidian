name: Verify completed candidate evidence
on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Completed full acceptance run; every source test job must have passed
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the original candidate and require all source jobs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.evidence_run }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const repository=process.env.GITHUB_REPOSITORY,runId=process.env.EVIDENCE_RUN;
          assert.match(runId,/^\d+$/);
          const api=async path=>{const response=await fetch('https://api.github.com/repos/'+repository+'/'+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});assert.ok(response.ok,'Source metadata request failed: '+response.status);return response.json();};
          const run=await api('actions/runs/'+runId),jobs=(await api('actions/runs/'+runId+'/jobs?per_page=100')).jobs;
          assert.equal(run.status,'completed');assert.equal(run.event,'workflow_dispatch');assert.equal(run.path,'.github/workflows/acceptance.yml');assert.equal(run.head_repository.full_name,repository);
          const expected=['build','foundation (ubuntu-latest)','foundation (windows-latest)','installation (ubuntu-latest)','installation (windows-latest)','native','publication','stage-gate',...['plan','tasks','create','project','learn','life','evolve','files','amytis','check'].map(skill=>'behavior (mixed, cosmos-'+skill+', mixed)')];
          assert.equal(jobs.length,expected.length+1,'Unexpected source job matrix');
          for(const name of expected){const matching=jobs.filter(job=>job.name===name);assert.equal(matching.length,1,'Missing or repeated source job: '+name);assert.equal(matching[0].conclusion,'success',name+' did not pass');}
          assert.equal(jobs.filter(job=>job.name==='release-gate').length,1);
          const metadata={repository,sourceRunId:String(run.id),sourceSha:run.head_sha,sourceAttempt:String(run.run_attempt),sourceConclusion:run.conclusion,sourceWorkflow:run.path,sourceJobs:jobs.map(({id,name,conclusion,html_url})=>({id,name,conclusion,url:html_url})),gateRunId:process.env.GITHUB_RUN_ID,gateSourceSha:process.env.GITHUB_SHA,reason:'Recheck complete original candidate evidence after installing the previously missing gate dependency; source reports and candidate are unchanged'};
          await fs.writeFile(process.env.RUNNER_TEMP+'/source-evidence.json',JSON.stringify(metadata,null,2));
          await fs.appendFile(process.env.GITHUB_OUTPUT,'sha='+metadata.sourceSha+'\n');
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24.21.0'}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: evidence/
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
      - name: Run the original candidate validator with preserved source identity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {validateRelease} from './tools/release-gate.mjs';
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex'),metadata=JSON.parse(await fs.readFile(process.env.RUNNER_TEMP+'/source-evidence.json','utf8'));
          const decision={sourceSha:metadata.sourceSha,runId:metadata.sourceRunId,attempt:metadata.sourceAttempt,releaseReady:false,gate:{runId:metadata.gateRunId,sourceSha:metadata.gateSourceSha,sourceConclusion:metadata.sourceConclusion,reason:metadata.reason,sourceJobs:metadata.sourceJobs}};
          try{
            const root=path.resolve('evidence'),manifestBytes=await fs.readFile(path.join(root,'cosmos-candidate/manifest.json')),candidate=JSON.parse(manifestBytes),reports={};
            assert.equal(candidate.sourceSha,decision.sourceSha);assert.equal(candidate.runId,decision.runId);assert.equal(candidate.attempt,decision.attempt);decision.candidate=candidate;
            for(const folder of await fs.readdir(root,{withFileTypes:true})){if(!folder.isDirectory()||folder.name==='cosmos-candidate'||folder.name==='release-decision')continue;for(const file of await fs.readdir(path.join(root,folder.name)))if(file.endsWith('.json'))reports[folder.name+'/'+file]=JSON.parse(await fs.readFile(path.join(root,folder.name,file),'utf8'));}
            for(const [name,report]of Object.entries(reports))if(name.endsWith('/candidate-identity.json'))assert.equal(report.manifestHash,hash(manifestBytes),'Manifest bytes mismatch '+name);
            for(const [file,expected]of Object.entries(candidate.files))assert.equal(hash(await fs.readFile(path.join(root,'cosmos-candidate',...file.split('/')))),expected,'Candidate bytes changed: '+file);
            const needs=Object.fromEntries(['build','foundation','native','publication','installation','behavior'].map(name=>[name,{result:'success'}]));
            decision.validated=validateRelease(reports,candidate,needs);decision.releaseReady=true;
          }catch(error){decision.error={message:error.message};process.exitCode=1;}
          finally{await fs.mkdir('artifacts',{recursive:true});await fs.writeFile('artifacts/release-decision.json',JSON.stringify(decision,null,2));console.log(JSON.stringify({releaseReady:decision.releaseReady,sourceRunId:decision.runId,gateRunId:decision.gate.runId,checks:decision.validated?.length,error:decision.error}));}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: release-decision,path: artifacts/release-decision.json,if-no-files-found: error}
