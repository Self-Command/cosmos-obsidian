name: Independent Cosmos candidate acceptance
on:
  push:
    branches: [main, codex/**]
  workflow_dispatch:
    inputs:
      behavior:
        description: Required real-host acceptance profile; smoke cannot release
        type: choice
        options: [none, smoke, full]
        default: none
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Check harness and release-gate syntax before compiling the candidate
        run: |
          node --check tools/behavior/run.mjs
          node --check tools/behavior/codex-host.mjs
          node --check tools/behavior/workflows.mjs
          node --check tools/release-gate.mjs
      - run: npm run build
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with: { name: cosmos-candidate, path: dist/, if-no-files-found: error }
  foundation:
    needs: build
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: npm }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with: { name: cosmos-candidate, path: dist/ }
      - run: npm run verify:package
      - run: npm test
      - run: node dist/cosmos.mjs help
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'foundation-${{ matrix.os }}', path: artifacts/, if-no-files-found: error }
  native:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: npm }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with: { name: cosmos-candidate, path: dist/ }
      - run: node tools/verify-package.mjs
      - name: Install isolated official Obsidian and TaskNotes
        shell: pwsh
        run: ./tools/native/setup.ps1
      - name: Probe actual CLI and runtime API
        run: node tools/native/probe.mjs
      - name: Exercise approved tasks through the actual native API
        run: node tools/native/tasks.mjs
      - name: Exercise immutable drafts and entities in actual Obsidian
        run: node tools/native/entities.mjs
      - name: Exercise all entities, lifecycle service, files and five real periodic creators
        run: node tools/native/business.mjs
      - name: Preserve original receipts and execution outcomes
        if: always()
        run: node tools/native/diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: native-environment, path: artifacts/, if-no-files-found: error }
  stage-gate:
    if: always()
    needs: [build, foundation, native, publication, installation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every implemented stage job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const n=JSON.parse(process.env.RESULTS);if(Object.values(n).some(x=>x.result!=="success"))process.exit(1);console.log("Implemented functional/package checks passed; required model and release gates are still separate.")'
  installation:
    needs: build
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.21.0',cache: npm}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with: {name: cosmos-candidate,path: dist/}
      - run: node tools/verify-package.mjs
      - run: node tools/installation-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'installation-${{ matrix.os }}',path: artifacts/,if-no-files-found: error}
  behavior:
    if: github.event_name == 'workflow_dispatch' && inputs.behavior != 'none'
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host: [codex, claude]
        case: [task, travel]
        activation: [implicit, injected]
        include:
          - {host: codex, case: workflows, activation: implicit}
          - {host: claude, case: workflows, activation: implicit}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      EVALUATION_TOKEN: ${{ secrets.EVALUATION_TOKEN }}
      BEHAVIOR_HOST: ${{ matrix.host }}
      BEHAVIOR_CASE: ${{ matrix.case }}
      BEHAVIOR_ACTIVATION: ${{ matrix.activation }}
      BEHAVIOR_PROFILE: ${{ inputs.behavior }}
      BEHAVIOR_SAMPLES: ${{ inputs.behavior == 'full' && matrix.case != 'workflows' && '3' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.21.0',cache: npm,cache-dependency-path: 'tools/behavior/package-lock.json'}
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix tools/behavior --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: {name: cosmos-candidate,path: dist/}
      - run: node tools/verify-package.mjs
      - shell: pwsh
        run: ./tools/native/setup.ps1
      - run: node tools/native/probe.mjs
      - name: Required model in official persisted host and real isolated Obsidian
        run: node tools/behavior/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'behavior-${{ matrix.host }}-${{ matrix.case }}-${{ matrix.activation }}',path: artifacts/,if-no-files-found: error}
  publication:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 35
    concurrency: {group: synthetic-publication, cancel-in-progress: false}
    env:
      PUBLICATION_TOKEN: ${{ secrets.PUBLICATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.21.0', cache: npm}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with: {name: cosmos-candidate, path: dist/}
      - run: node tools/verify-package.mjs
      - shell: pwsh
        run: ./tools/native/setup.ps1
      - run: node tools/native/probe.mjs
      - shell: pwsh
        run: ./tools/native/publication-setup.ps1
      - run: node tools/native/publication.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: native-publication, path: artifacts/, if-no-files-found: error}
  release-gate:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.behavior == 'full'
    needs: [build, foundation, native, publication, installation, behavior]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.21.0'}
      - uses: actions/download-artifact@v4
        with: {path: evidence/}
      - name: Require complete reports and identical candidate identity from every layer
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: node tools/release-gate.mjs evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: release-decision,path: artifacts/release-decision.json,if-no-files-found: error}
